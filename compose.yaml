name: suwstockdrill

services:
  db:
    profiles: ["db"]
    image: docker.io/library/postgres:17.11
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-suwstockdrill}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-suwstockdrill}
      POSTGRES_DB: ${POSTGRES_DB:-suwstockdrill}
    ports:
      - "127.0.0.1:5573:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  server:
    image: suwstockdrill-server:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Suwstockdrill.Server/Dockerfile
    environment:
      ConnectionStrings__Default: ${ConnectionStrings__Default:-Host=db;Port=5432;Database=suwstockdrill;Username=suwstockdrill;Password=suwstockdrill}
    depends_on:
      db:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:6340/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    image: suwstockdrill-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Suwstockdrill.Web/Dockerfile
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://server:6340}
    ports:
      - "127.0.0.1:${WEB_PORT:-8230}:8080"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
